<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ResumesMint</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d9e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 14px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to your ResumesMint account
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit">
        Sign In
      </button>

      <div id="message"></div>

    </form>

    <div class="links">
      <a href="/signup.html">Create Account</a>
      <a href="/forgot-password.html">Forgot Password?</a>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Signing in...";

      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = "Login successful!";

          setTimeout(() => {
            window.location.href = "/";
          }, 800);

        } else {
          message.textContent =
            data.message || "Login failed.";
        }

      } catch (error) {
        console.error(error);

        message.textContent =
          "Unable to connect to the server.";
      }
    });
  </script>

</body>
</html>
