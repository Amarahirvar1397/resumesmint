<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ResumesMint</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d9e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Reset Password</h1>

    <p class="subtitle">
      Create a new password for your ResumesMint account.
    </p>

    <form id="resetForm">

      <div class="form-group">
        <label for="password">New Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter new password"
          minlength="6"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="6"
          required
        >
      </div>

      <button type="submit">
        Reset Password
      </button>

      <div id="message"></div>

    </form>

    <div class="login-link">
      <a href="/login.html">Back to Sign In</a>
    </div>

  </div>

  <script>
    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!token) {
        message.textContent = "Invalid or missing reset token.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Resetting password...";

      try {
        const response = await fetch("/auth/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent =
            "Password reset successfully!";

          setTimeout(() => {
            window.location.href = "/login.html";
          }, 1500);

        } else {
          message.textContent =
            data.message || "Password reset failed.";
        }

      } catch (error) {
        console.error(error);

        message.textContent =
          "Unable to connect to the server.";
      }
    });
  </script>

</body>
</html>
