<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - ResumesMint</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
    }

    .otp-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .email {
      font-weight: 600;
      color: #2563eb;
      word-break: break-word;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5d9e0;
      border-radius: 8px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="otp-container">

    <h1>Verify Your Email</h1>

    <p class="subtitle">
      We've sent a 6-digit OTP to
      <br>
      <span class="email" id="emailDisplay"></span>
    </p>

    <form id="otpForm">

      <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        pattern="[0-9]{6}"
        placeholder="000000"
        required
      >

      <button type="submit">
        Verify Email
      </button>

      <div id="message"></div>

    </form>

    <div class="back-link">
      <a href="/signup.html">Back to Sign Up</a>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email");

    const emailDisplay = document.getElementById("emailDisplay");
    const otpForm = document.getElementById("otpForm");
    const message = document.getElementById("message");

    if (!email) {
      message.textContent = "Email address is missing.";
    } else {
      emailDisplay.textContent = email;
    }

    otpForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const otp = document.getElementById("otp").value.trim();

      if (!/^\d{6}$/.test(otp)) {
        message.textContent = "Please enter a valid 6-digit OTP.";
        return;
      }

      message.textContent = "Verifying...";

      try {
        const response = await fetch("/auth/verify-otp", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            otp
          })
        });

        const data = await response.json();

        if (response.ok) {
          message.textContent = "Email verified successfully!";

          setTimeout(() => {
            window.location.href = "/login.html";
          }, 1000);

        } else {
          message.textContent =
            data.message || "OTP verification failed.";
        }

      } catch (error) {
        console.error(error);
        message.textContent =
          "Unable to connect to the server.";
      }
    });
  </script>

</body>
</html>
